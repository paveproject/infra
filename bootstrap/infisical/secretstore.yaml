# Applied imperatively by cli/ (src/steps/07-cluster-secret-store.ts), not
# GitOps-managed by ArgoCD: the ArgoCD repository credentials (see
# bootstrap/argocd/github-repo.yaml) are themselves an ExternalSecret
# resolved through this store, so if this repo is ever made private, ArgoCD
# could not clone it to learn about a ClusterSecretStore that lived here
# instead - same chicken-and-egg reasoning as External Secrets Operator
# itself (see cli/src/steps/05-install-external-secrets.ts) and the
# infisical-auth Secret (cli/src/steps/06-infisical-secret.ts) one level
# further out. Every ExternalSecret under kubernetes/**/services/* still
# just references this by name, same as before.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical
spec:
  provider:
    infisical:
      # EU-hosted Infisical, not the default app.infisical.com.
      hostAPI: https://eu.infisical.com
      auth:
        universalAuthCredentials:
          clientId:
            name: infisical-auth
            namespace: external-secrets
            key: clientId
          clientSecret:
            name: infisical-auth
            namespace: external-secrets
            key: clientSecret
      secretsScope:
        projectSlug: pave
        environmentSlug: prod
        secretsPath: /
        recursive: false
