# One-shot `helm install` values for ArgoCD, applied imperatively by
# cli/ before GitOps exists to manage anything (chicken-and-egg). Re-running
# `helm upgrade --install` with this file is how you upgrade ArgoCD itself
# later - its own Deployment is deliberately NOT managed by a GitOps
# Application, so a bad sync can never take down the thing doing the
# syncing. Only its Ingress lives under kubernetes/core/services/argocd.
#
# IMPORTANT: the `sops-age` Secret this file mounts must already exist in
# the `argocd` namespace before this is applied, or the repo-server pod
# hangs forever on a missing volume mount (helm's --wait times out). The
# CLI creates it first for exactly this reason - see cli/src/steps/05-sops-secret.ts.
server:
  insecure: true # no TLS cert yet on first boot; cert-manager + Ingress take over once kubernetes/core is live
  extraArgs:
    - --insecure

configs:
  cm:
    # --enable-helm: inflate `helmCharts:` blocks (used all over
    #   kubernetes/*/services/*).
    # --enable-alpha-plugins + --enable-exec: required for the ksops exec
    #   KRM function (ksops-generator.yaml) to run at all.
    kustomize.buildOptions: "--enable-helm --enable-alpha-plugins --enable-exec"

# ksops (https://github.com/viaduct-ai/kustomize-sops) lets `kustomize
# build` decrypt SOPS-encrypted YAML inline via a `ksops-generator.yaml`
# next to the secret, instead of committing cleartext. Only the `ksops`
# binary is installed onto PATH - NOT `--with-kustomize`, which would
# replace the repo-server's own kustomize with the one bundled in the
# ksops image; that one's built against a different `helm` CLI interface
# than ArgoCD ships and crashes on `helm version -c --short`. The Age
# *private* key to actually decrypt comes from the `sops-age` Secret (see
# above), never from this file.
repoServer:
  volumes:
    - name: custom-tools
      emptyDir: {}
    - name: sops-age
      secret:
        secretName: sops-age

  initContainers:
    - name: install-ksops
      image: viaductoss/ksops:v4.5.1
      command: ["/usr/local/bin/ksops", "install", "/custom-tools"]
      volumeMounts:
        - name: custom-tools
          mountPath: /custom-tools

  volumeMounts:
    - name: custom-tools
      mountPath: /usr/local/bin/ksops
      subPath: ksops
    - name: sops-age
      mountPath: /.config/sops/age

  env:
    - name: XDG_CONFIG_HOME
      value: /.config
    - name: SOPS_AGE_KEY_FILE
      value: /.config/sops/age/keys.txt
