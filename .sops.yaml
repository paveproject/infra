# SOPS encryption rules for this repo.
# One Age key pair for the whole infra repo. Generated with
# `age-keygen -o ~/.config/sops/age/paveproject-infra.txt`.
# This file only ever holds the PUBLIC key — the private key must never be
# committed, and must be backed up somewhere safe outside this machine
# (password manager, etc.) — it's the only way to decrypt anything below.
keys:
  - &paveproject age10tpu8yflqrxge76ue8sc7w9dcqkemkdjr8ggwpzqvmwtd7gy9q9s5xs5tp

creation_rules:
  # Any Kubernetes secret manifest, anywhere under kubernetes/, named
  # *.sops.yaml - keeps secrets in their own file so plain manifests stay
  # cleartext and diff-friendly.
  - path_regex: kubernetes/.*\.sops\.ya?ml$
    key_groups:
      - age:
          - *paveproject
