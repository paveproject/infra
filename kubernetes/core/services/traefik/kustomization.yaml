# Traefik was never in this repo: k3s bundled it as an addon and the
# manifests only ever referenced `ingressClassName: traefik`. A vcluster
# bundles nothing, so it has to be declared.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: traefik
    repo: https://traefik.github.io/charts
    version: 41.6.1
    releaseName: traefik
    namespace: traefik
    valuesInline:
      # ClusterIP, not LoadBalancer — the one real difference from homelab's
      # Traefik. cloudflared runs beside it and dials OUT to Cloudflare, then
      # proxies to this Service internally, so nothing has to be reachable
      # from outside and no address is taken from the platform's Cilium pool.
      # Traefik therefore has no presence on the cluster VLAN at all, which
      # is one less thing for the tenant's network policy to reason about.
      # service.spec.type, not service.type — the chart passes `service.spec`
      # straight through to the Service spec and ignores anything else, so
      # the shorter spelling is accepted and silently does nothing.
      service:
        spec:
          type: ClusterIP

      ingressClass:
        enabled: true
        isDefaultClass: true

      providers:
        kubernetesIngress:
          # A ClusterIP Service has no status.loadBalancer.ingress to copy
          # from, so publishedService leaves every Ingress with an empty
          # status forever — and ArgoCD reads that as Progressing, which
          # pinned the api Application on "waiting for healthy state of
          # Ingress/api" with the app itself running fine. Writing the
          # Service's own DNS name in instead is both accurate (that is
          # where the tunnel delivers traffic) and visible in
          # `kubectl get ingress`.
          publishedService:
            enabled: false
          ingressEndpoint:
            hostname: traefik.traefik.svc.cluster.local
