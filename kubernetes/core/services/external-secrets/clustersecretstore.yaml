# Cluster-wide: every ExternalSecret under kubernetes/apps/services/*
# references this by name. Auth comes from the `infisical-auth` Secret
# (clientId/clientSecret of an Infisical Machine Identity) created
# imperatively by cli/src/steps/05-infisical-secret.ts - it can't be
# GitOps-managed into existence, same chicken-and-egg reasoning the old
# sops-age Secret had.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical
spec:
  provider:
    infisical:
      # EU-hosted Infisical, not the default app.infisical.com.
      hostAPI: https://eu.infisical.com
      auth:
        universalAuthCredentials:
          clientId:
            name: infisical-auth
            namespace: external-secrets
            key: clientId
          clientSecret:
            name: infisical-auth
            namespace: external-secrets
            key: clientSecret
      secretsScope:
        projectSlug: pave
        environmentSlug: prod
        secretsPath: /
        recursive: false
