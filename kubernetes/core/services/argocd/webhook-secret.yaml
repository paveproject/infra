# Merges webhook.github.secret into the argocd-secret the Helm chart
# already created (admin password, server.secretkey, etc.) - Merge, not
# Owner, so ESO only adds/updates this one key and leaves the rest alone.
# Lets ArgoCD verify the HMAC signature GitHub sends on each push to
# paveproject/infra, so a webhook (configured on that repo, pointing at
# https://argocd.paveproject.org/api/webhook) triggers an instant sync
# instead of waiting for the next poll.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-webhook-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: argocd-secret
    creationPolicy: Merge
  data:
    - secretKey: webhook.github.secret
      remoteRef:
        key: ARGOCD_WEBHOOK_SECRET
