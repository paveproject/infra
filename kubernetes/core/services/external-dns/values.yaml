# Watches every Ingress in the cluster and keeps one Cloudflare record per
# host, so adding a hostname is an Ingress and nothing else.
#
# CNAME, not A. There is no public IP to point at any more - traffic arrives
# through the Cloudflare tunnel, whose address is
# <tunnel-id>.cfargotunnel.com. Each Ingress names that in an
# `external-dns.kubernetes.io/target` annotation; without it
# external-dns would read Traefik's published endpoint
# (traefik.traefik.svc.cluster.local, see ../traefik/kustomization.yaml)
# and write an internal DNS name into a public zone.
provider: cloudflare

env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-api-token
        key: api-token

sources:
  - ingress

extraArgs:
  # A cfargotunnel.com CNAME is only reachable proxied - Cloudflare has to
  # be in the path for the tunnel to be the path.
  - --cloudflare-proxied
  # CNAME only. A was listed while the old cluster's A records still stood -
  # Cloudflare refuses a CNAME on a name that already has one - and they are
  # gone now, so external-dns has no business touching that type.
  - --managed-record-types=CNAME
  - --managed-record-types=TXT

policy: sync
registry: txt
txtOwnerId: "paveproject"
interval: "1m"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi
