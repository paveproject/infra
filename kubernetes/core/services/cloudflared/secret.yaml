# PREREQUISITE, and the one thing this repo cannot create for itself.
#
# In the Cloudflare dashboard (Zero Trust → Networks → Tunnels), create a
# tunnel, then put its token in Infisical as CLOUDFLARE_TUNNEL_TOKEN. The
# token encodes the tunnel id and its credentials; cloudflared needs nothing
# else to connect.
#
# Then add the public hostnames to that tunnel, all with the same service:
#   argocd.paveproject.org  → http://traefik.traefik.svc.cluster.local:80
#   api.paveproject.org     → http://traefik.traefik.svc.cluster.local:80
#   medias.paveproject.org  → http://traefik.traefik.svc.cluster.local:80
#
# http, not https, and that is deliberate. A tunnel means Cloudflare
# terminates TLS at its edge no matter what the origin speaks, so a
# certificate on Traefik would only encrypt the cloudflared→Traefik hop,
# which never leaves this cluster's pod network. That is why there is no
# cert-manager here and why Traefik does not redirect 80→443 — both would
# be pure ceremony. It is also why external-dns is gone: Cloudflare creates
# the CNAME for each public hostname itself.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: cloudflared-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: CLOUDFLARE_TUNNEL_TOKEN
