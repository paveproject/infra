# PREREQUISITE, and the one thing this repo cannot create for itself.
#
# In the Cloudflare dashboard (Zero Trust -> Networks -> Tunnels), create a
# tunnel and put its token in Infisical as CLOUDFLARE_TUNNEL_TOKEN. That is
# the whole manual part: the hostname routing lives in configmap.yaml here,
# and the DNS records are external-dns's job.
#
# The token is base64 of {"a":AccountTag,"t":TunnelID,"s":TunnelSecret} —
# exactly the three fields a credentials file needs, under shorter keys. So
# this templates one out of the other rather than asking for the same
# secret twice in two shapes. Running cloudflared with a credentials file
# instead of --token is what makes it read LOCAL ingress rules: with
# --token it fetches its config from Cloudflare and configmap.yaml is
# ignored, which puts the routing in a dashboard instead of in git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: cloudflared-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        credentials.json: |
          {{- $t := .token | b64dec | fromJson }}
          {"AccountTag":"{{ $t.a }}","TunnelID":"{{ $t.t }}","TunnelSecret":"{{ $t.s }}"}
  data:
    - secretKey: token
      remoteRef:
        key: CLOUDFLARE_TUNNEL_TOKEN
