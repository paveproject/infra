# Nested app-of-apps: the actual Pave services (postgres, redis, api,
# notify, rustfs) live under kubernetes/apps, separate from this cluster's
# own infra (argocd, cert-manager) - each can be added to/removed from
# independently of the other.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/paveproject/infra.git
    targetRevision: main
    path: kubernetes/apps/applications
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
