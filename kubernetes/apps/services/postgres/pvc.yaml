apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  accessModes:
    - ReadWriteOnce
  # Explicit rather than relying on the host's default StorageClass: the
  # vcluster syncs the platform's classes in, and which one is default is
  # not this repo's decision to depend on.
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
