apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-backup-target
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: postgres-backup-target
    creationPolicy: Owner
  data:
    # secretKey stays AWS_ACCESS_KEY_ID/SECRET_ACCESS_KEY locally - that's
    # what the `aws` CLI in backup-cronjob.yaml auto-detects. remoteRef.key
    # is named BACKUP_S3_* in Infisical since this isn't actually AWS.
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: BACKUP_S3_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: BACKUP_S3_SECRET_ACCESS_KEY
    - secretKey: BACKUP_S3_BUCKET
      remoteRef:
        key: BACKUP_S3_BUCKET
    - secretKey: BACKUP_S3_ENDPOINT
      remoteRef:
        key: BACKUP_S3_ENDPOINT
