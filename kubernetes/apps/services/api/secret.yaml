# DATABASE_URL is derived here, not a separate Infisical key - it only
# ever embeds POSTGRES_PASSWORD, which already has one source of truth
# (postgres/secret.yaml reads the exact same Infisical key). Templating
# this in-cluster means that key never needs to be re-typed/duplicated.
# Same reasoning for the S3 credential pair: this reads rustfs's own
# RUSTFS_ACCESS_KEY/SECRET_KEY remote keys directly (api is just another
# S3 client of the same rustfs instance) instead of a second, separately
# maintained copy.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: api-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        AUTH_SECRET: "{{ .AUTH_SECRET }}"
        REDIS_PASSWORD: "{{ .REDIS_PASSWORD }}"
        S3_ACCESS_KEY_ID: "{{ .RUSTFS_ACCESS_KEY }}"
        S3_SECRET_ACCESS_KEY: "{{ .RUSTFS_SECRET_KEY }}"
        DATABASE_URL: "postgres://pave:{{ .POSTGRES_PASSWORD }}@postgres:5432/pave"
  data:
    - secretKey: AUTH_SECRET
      remoteRef:
        key: AUTH_SECRET
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: REDIS_PASSWORD
    - secretKey: RUSTFS_ACCESS_KEY
      remoteRef:
        key: RUSTFS_ACCESS_KEY
    - secretKey: RUSTFS_SECRET_KEY
      remoteRef:
        key: RUSTFS_SECRET_KEY
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: POSTGRES_PASSWORD
