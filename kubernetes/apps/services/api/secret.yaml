apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: api-secrets
    creationPolicy: Owner
  data:
    - secretKey: AUTH_SECRET
      remoteRef:
        key: AUTH_SECRET
    - secretKey: API_URL
      remoteRef:
        key: API_URL
    - secretKey: DATABASE_URL
      remoteRef:
        key: DATABASE_URL
    - secretKey: REDIS_HOST
      remoteRef:
        key: REDIS_HOST
    - secretKey: REDIS_PORT
      remoteRef:
        key: REDIS_PORT
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: REDIS_PASSWORD
    - secretKey: S3_ENDPOINT
      remoteRef:
        key: S3_ENDPOINT
    - secretKey: S3_PUBLIC_ENDPOINT
      remoteRef:
        key: S3_PUBLIC_ENDPOINT
    - secretKey: S3_REGION
      remoteRef:
        key: S3_REGION
    - secretKey: S3_ACCESS_KEY_ID
      remoteRef:
        key: S3_ACCESS_KEY_ID
    - secretKey: S3_SECRET_ACCESS_KEY
      remoteRef:
        key: S3_SECRET_ACCESS_KEY
    - secretKey: S3_BUCKET
      remoteRef:
        key: S3_BUCKET
