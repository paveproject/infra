# Every value api needs comes from Infisical - even non-sensitive config
# (REDIS_HOST, S3_REGION, ...) - so any other service that later needs
# the same value reads the exact same Infisical key instead of a second
# hardcoded copy drifting out of sync somewhere.
#
# DATABASE_URL is the one deliberate exception: it's never typed into
# Infisical directly. It's built here, in-cluster, from POSTGRES_USER/
# PASSWORD/DB (same Infisical keys postgres's own secret reads) plus the
# literal `postgres:5432` - that host:port is a fact about *this*
# cluster's internal networking, not portable config, so it doesn't
# belong in Infisical either. Same reasoning for S3_ACCESS_KEY_ID/
# SECRET_ACCESS_KEY: api is just another S3 client of the same rustfs
# instance, so it reads rustfs's own RUSTFS_ACCESS_KEY/SECRET_KEY keys
# directly instead of a second copy.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: api-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        AUTH_SECRET: "{{ .AUTH_SECRET }}"
        API_URL: "{{ .API_URL }}"
        # Bearer secret CD sends when it reports a shipped mobile version
        # (see pave's .github/workflows/mobile-router.yml and
        # apps/api/src/app/internal/version_policy). Not tied to any
        # external provider - generate it yourself (`openssl rand -hex 32`)
        # and put the same value in both Infisical and the
        # INFISICAL_API_INTERNAL_VERSION_POLICY_SECRET GitHub secret.
        API_INTERNAL_VERSION_POLICY_SECRET: "{{ .API_INTERNAL_VERSION_POLICY_SECRET }}"
        # Backs apps/api/src/libs/app_store_connect.rs (JWT signing to call
        # the App Store Connect API) and the HMAC signature check in
        # apps/api/src/app/webhooks/app_store_connect/guard.rs. PRIVATE_KEY
        # is the raw AuthKey_*.p8 content - that code handles both a real
        # multi-line value and one flattened to literal `\n`s, so either
        # form pasted into Infisical works.
        APP_STORE_CONNECT_KEY_ID: "{{ .APP_STORE_CONNECT_KEY_ID }}"
        APP_STORE_CONNECT_ISSUER_ID: "{{ .APP_STORE_CONNECT_ISSUER_ID }}"
        APP_STORE_CONNECT_PRIVATE_KEY: "{{ .APP_STORE_CONNECT_PRIVATE_KEY }}"
        APP_STORE_CONNECT_APP_ID: "{{ .APP_STORE_CONNECT_APP_ID }}"
        APP_STORE_CONNECT_WEBHOOK_SECRET: "{{ .APP_STORE_CONNECT_WEBHOOK_SECRET }}"
        REDIS_HOST: "{{ .REDIS_HOST }}"
        REDIS_PORT: "{{ .REDIS_PORT }}"
        REDIS_PASSWORD: "{{ .REDIS_PASSWORD }}"
        S3_ENDPOINT: "{{ .S3_ENDPOINT }}"
        S3_PUBLIC_ENDPOINT: "{{ .S3_PUBLIC_ENDPOINT }}"
        S3_REGION: "{{ .S3_REGION }}"
        S3_BUCKET_PUBLIC: "{{ .S3_BUCKET_PUBLIC }}"
        # Protest-mode uploads (see pave's app::me::protest_sessions) -
        # never served over a public URL, must stay a separate bucket
        # from S3_BUCKET_PUBLIC.
        S3_BUCKET_PRIVATE: "{{ .S3_BUCKET_PRIVATE }}"
        S3_ACCESS_KEY_ID: "{{ .RUSTFS_ACCESS_KEY }}"
        S3_SECRET_ACCESS_KEY: "{{ .RUSTFS_SECRET_KEY }}"
        DATABASE_URL: "postgres://{{ .POSTGRES_USER }}:{{ .POSTGRES_PASSWORD }}@postgres:5432/{{ .POSTGRES_DB }}"
        # Consumed by the `geoipupdate` initContainer below, not by `api`
        # itself - renamed to the env names that tool expects, same
        # reasoning as the S3_* renames above.
        GEOIPUPDATE_ACCOUNT_ID: "{{ .MAXMIND_ACCOUNT_ID }}"
        GEOIPUPDATE_LICENSE_KEY: "{{ .MAXMIND_LICENSE_KEY }}"
  data:
    - secretKey: AUTH_SECRET
      remoteRef:
        key: AUTH_SECRET
    - secretKey: API_URL
      remoteRef:
        key: API_URL
    - secretKey: API_INTERNAL_VERSION_POLICY_SECRET
      remoteRef:
        key: API_INTERNAL_VERSION_POLICY_SECRET
    - secretKey: APP_STORE_CONNECT_KEY_ID
      remoteRef:
        key: APP_STORE_CONNECT_KEY_ID
    - secretKey: APP_STORE_CONNECT_ISSUER_ID
      remoteRef:
        key: APP_STORE_CONNECT_ISSUER_ID
    - secretKey: APP_STORE_CONNECT_PRIVATE_KEY
      remoteRef:
        key: APP_STORE_CONNECT_PRIVATE_KEY
    - secretKey: APP_STORE_CONNECT_APP_ID
      remoteRef:
        key: APP_STORE_CONNECT_APP_ID
    - secretKey: APP_STORE_CONNECT_WEBHOOK_SECRET
      remoteRef:
        key: APP_STORE_CONNECT_WEBHOOK_SECRET
    - secretKey: REDIS_HOST
      remoteRef:
        key: REDIS_HOST
    - secretKey: REDIS_PORT
      remoteRef:
        key: REDIS_PORT
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: REDIS_PASSWORD
    - secretKey: S3_ENDPOINT
      remoteRef:
        key: S3_ENDPOINT
    - secretKey: S3_PUBLIC_ENDPOINT
      remoteRef:
        key: S3_PUBLIC_ENDPOINT
    - secretKey: S3_REGION
      remoteRef:
        key: S3_REGION
    - secretKey: S3_BUCKET_PUBLIC
      remoteRef:
        key: S3_BUCKET_PUBLIC
    - secretKey: S3_BUCKET_PRIVATE
      remoteRef:
        key: S3_BUCKET_PRIVATE
    - secretKey: RUSTFS_ACCESS_KEY
      remoteRef:
        key: RUSTFS_ACCESS_KEY
    - secretKey: RUSTFS_SECRET_KEY
      remoteRef:
        key: RUSTFS_SECRET_KEY
    - secretKey: POSTGRES_USER
      remoteRef:
        key: POSTGRES_USER
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: POSTGRES_PASSWORD
    - secretKey: POSTGRES_DB
      remoteRef:
        key: POSTGRES_DB
    - secretKey: MAXMIND_ACCOUNT_ID
      remoteRef:
        key: MAXMIND_ACCOUNT_ID
    - secretKey: MAXMIND_LICENSE_KEY
      remoteRef:
        key: MAXMIND_LICENSE_KEY
