apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/paveproject/pave-api:latest
          ports:
            - containerPort: 3002
          env:
            - name: API_URL
              value: https://api.paveproject.org
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: S3_ENDPOINT
              value: http://rustfs:9000
            - name: S3_PUBLIC_ENDPOINT
              value: https://medias.paveproject.org
            - name: S3_REGION
              value: us-east-1
            - name: S3_BUCKET_PUBLIC
              value: avatars
          envFrom:
            - secretRef:
                name: api-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 20
