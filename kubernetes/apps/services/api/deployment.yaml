apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      # Refreshes the GeoLite2 City database into `geoip-db` before `api`
      # starts - see apps/api/src/libs/geoip.rs's own doc comment on why
      # the file itself is never committed (public repo, MaxMind's
      # license forbids redistributing it) or baked into the image (it's
      # updated by MaxMind roughly weekly - this way every pod restart
      # just gets whatever's current instead of going stale).
      initContainers:
        - name: geoipupdate
          image: ghcr.io/maxmind/geoipupdate:v8.0.0
          env:
            - name: GEOIPUPDATE_EDITION_IDS
              value: "GeoLite2-City"
            - name: GEOIPUPDATE_DB_DIR
              value: "/usr/share/GeoIP"
            - name: GEOIPUPDATE_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: GEOIPUPDATE_ACCOUNT_ID
            - name: GEOIPUPDATE_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: GEOIPUPDATE_LICENSE_KEY
          volumeMounts:
            - name: geoip-db
              mountPath: /usr/share/GeoIP
      containers:
        - name: api
          image: ghcr.io/paveproject/pave-api:b21-80b18fa
          ports:
            - containerPort: 3002
          envFrom:
            - secretRef:
                name: api-secrets
          # Not in Infisical - this is just where `geoip-db` above lands
          # in-cluster, not portable config (same reasoning api/secret.yaml
          # already gives for DATABASE_URL/S3_ACCESS_KEY_ID).
          env:
            - name: GEOIP_DB_PATH
              value: "/usr/share/GeoIP/GeoLite2-City.mmdb"
          volumeMounts:
            - name: geoip-db
              mountPath: /usr/share/GeoIP
              readOnly: true
          # Rust, not Recomend's Node api - much lighter baseline.
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "400m"
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: geoip-db
          emptyDir: {}
