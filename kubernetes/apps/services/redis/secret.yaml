apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: redis-secrets
    creationPolicy: Owner
  data:
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: REDIS_PASSWORD
