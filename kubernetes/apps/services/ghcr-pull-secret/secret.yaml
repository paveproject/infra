# GHCR packages are private by default on first push, regardless of the
# source repo's own visibility - every Deployment/Job pulling a
# ghcr.io/paveproject/pave-* image needs this via imagePullSecrets, or
# it hangs in ImagePullBackOff. One Secret in the pave namespace, no
# Reflector needed - every consumer already lives here.
#
# Shares GITHUB_USERNAME/GITHUB_TOKEN with bootstrap/argocd/github-repo.yaml
# instead of a separate GHCR-only PAT - one classic GitHub token with both
# `repo` and `read:packages` scopes. If a second namespace ever needs this
# (a CI runner namespace, say), switch to a ClusterExternalSecret with a
# namespaceSelector instead of duplicating this file - see
# recomendapp/infra's kubernetes/core/services/ghcr-pull-secret for that
# shape.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: ghcr-pull-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "ghcr.io": {
                "auth": "{{ printf "%s:%s" .username .token | b64enc }}"
              }
            }
          }
  data:
    - secretKey: username
      remoteRef:
        key: GITHUB_USERNAME
    - secretKey: token
      remoteRef:
        key: GITHUB_TOKEN
