# GHCR packages are private by default on first push, regardless of the
# source repo's own visibility - every Deployment/Job pulling a
# ghcr.io/paveproject/pave-* image needs this via imagePullSecrets, or
# it hangs in ImagePullBackOff. One Secret in the pave namespace, no
# Reflector needed - every consumer already lives here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: ghcr-pull-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "ghcr.io": {
                "auth": "{{ printf "%s:%s" .username .token | b64enc }}"
              }
            }
          }
  data:
    - secretKey: username
      remoteRef:
        key: GHCR_PULL_USERNAME
    - secretKey: token
      remoteRef:
        key: GHCR_PULL_TOKEN
