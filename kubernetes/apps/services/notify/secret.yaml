apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: notify-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: notify-secrets
    creationPolicy: Owner
  data:
    - secretKey: RESEND_API_KEY
      remoteRef:
        key: RESEND_API_KEY
    - secretKey: RESEND_FROM_EMAIL
      remoteRef:
        key: RESEND_FROM_EMAIL
    - secretKey: ASSETS_BASE_URL
      remoteRef:
        key: ASSETS_BASE_URL
    - secretKey: REDIS_HOST
      remoteRef:
        key: REDIS_HOST
    - secretKey: REDIS_PORT
      remoteRef:
        key: REDIS_PORT
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: REDIS_PASSWORD
