apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: notify-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: notify-secrets
    creationPolicy: Owner
  data:
    - secretKey: RESEND_API_KEY
      remoteRef:
        key: RESEND_API_KEY
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: REDIS_PASSWORD
