# ASSETS_BASE_URL is derived, not a separate Infisical key - it's just
# S3_PUBLIC_ENDPOINT + S3_BUCKET_PUBLIC + the static/ prefix, and both
# pieces already have one source of truth (same Infisical keys api's
# secret reads).
#
# DATABASE_URL is the same deliberate exception as api's own secret.yaml:
# never typed into Infisical directly, built in-cluster from
# POSTGRES_USER/PASSWORD/DB (the exact same Infisical keys postgres's and
# api's secrets read) plus the literal `postgres:5432`. notify now
# resolves push tokens/language itself (see pave's apps/notify/src/main.rs,
# apps/notify/src/recipients.rs), so it needs the same DB access api has -
# same Postgres instance/schema, not a separate database.
#
# FIREBASE_*/APNS_* back apps/notify/src/push (FCM + APNs sending).
# FIREBASE_PRIVATE_KEY_B64/APNS_KEY_B64 are their respective private keys,
# base64-encoded to dodge the multiline-secret problem - paste the exact
# base64 string, not the raw PEM. APNS_KEY_ID/APNS_TEAM_ID/APNS_KEY_B64 are
# one Apple Developer team's single APNs auth key, shared across every app
# on that team - not specific to Pave; only APNS_BUNDLE_ID (the app's own
# bundle id) differs per app.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: notify-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: notify-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        RESEND_API_KEY: "{{ .RESEND_API_KEY }}"
        RESEND_FROM_EMAIL: "{{ .RESEND_FROM_EMAIL }}"
        REDIS_HOST: "{{ .REDIS_HOST }}"
        REDIS_PORT: "{{ .REDIS_PORT }}"
        REDIS_PASSWORD: "{{ .REDIS_PASSWORD }}"
        S3_ENDPOINT: "{{ .S3_ENDPOINT }}"
        S3_PUBLIC_ENDPOINT: "{{ .S3_PUBLIC_ENDPOINT }}"
        S3_BUCKET_PUBLIC: "{{ .S3_BUCKET_PUBLIC }}"
        ASSETS_BASE_URL: "{{ .S3_PUBLIC_ENDPOINT }}/{{ .S3_BUCKET_PUBLIC }}/static"
        FIREBASE_PROJECT_ID: "{{ .FIREBASE_PROJECT_ID }}"
        FIREBASE_CLIENT_EMAIL: "{{ .FIREBASE_CLIENT_EMAIL }}"
        FIREBASE_PRIVATE_KEY_B64: "{{ .FIREBASE_PRIVATE_KEY_B64 }}"
        APNS_KEY_B64: "{{ .APNS_KEY_B64 }}"
        APNS_KEY_ID: "{{ .APNS_KEY_ID }}"
        APNS_TEAM_ID: "{{ .APNS_TEAM_ID }}"
        APNS_BUNDLE_ID: "{{ .APNS_BUNDLE_ID }}"
        DATABASE_URL: "postgres://{{ .POSTGRES_USER }}:{{ .POSTGRES_PASSWORD }}@postgres:5432/{{ .POSTGRES_DB }}"
  data:
    - secretKey: RESEND_API_KEY
      remoteRef:
        key: RESEND_API_KEY
    - secretKey: RESEND_FROM_EMAIL
      remoteRef:
        key: RESEND_FROM_EMAIL
    - secretKey: REDIS_HOST
      remoteRef:
        key: REDIS_HOST
    - secretKey: REDIS_PORT
      remoteRef:
        key: REDIS_PORT
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: REDIS_PASSWORD
    - secretKey: S3_ENDPOINT
      remoteRef:
        key: S3_ENDPOINT
    - secretKey: S3_PUBLIC_ENDPOINT
      remoteRef:
        key: S3_PUBLIC_ENDPOINT
    - secretKey: S3_BUCKET_PUBLIC
      remoteRef:
        key: S3_BUCKET_PUBLIC
    - secretKey: FIREBASE_PROJECT_ID
      remoteRef:
        key: FIREBASE_PROJECT_ID
    - secretKey: FIREBASE_CLIENT_EMAIL
      remoteRef:
        key: FIREBASE_CLIENT_EMAIL
    - secretKey: FIREBASE_PRIVATE_KEY_B64
      remoteRef:
        key: FIREBASE_PRIVATE_KEY_B64
    - secretKey: APNS_KEY_B64
      remoteRef:
        key: APNS_KEY_B64
    - secretKey: APNS_KEY_ID
      remoteRef:
        key: APNS_KEY_ID
    - secretKey: APNS_TEAM_ID
      remoteRef:
        key: APNS_TEAM_ID
    - secretKey: APNS_BUNDLE_ID
      remoteRef:
        key: APNS_BUNDLE_ID
    - secretKey: POSTGRES_USER
      remoteRef:
        key: POSTGRES_USER
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: POSTGRES_PASSWORD
    - secretKey: POSTGRES_DB
      remoteRef:
        key: POSTGRES_DB
