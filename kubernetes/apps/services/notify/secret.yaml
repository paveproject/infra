# ASSETS_BASE_URL is derived, not a separate Infisical key - it's just
# S3_PUBLIC_ENDPOINT + S3_BUCKET_PUBLIC + the static/ prefix, and both
# pieces already have one source of truth (same Infisical keys api's
# secret reads).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: notify-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: notify-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        RESEND_API_KEY: "{{ .RESEND_API_KEY }}"
        RESEND_FROM_EMAIL: "{{ .RESEND_FROM_EMAIL }}"
        REDIS_HOST: "{{ .REDIS_HOST }}"
        REDIS_PORT: "{{ .REDIS_PORT }}"
        REDIS_PASSWORD: "{{ .REDIS_PASSWORD }}"
        ASSETS_BASE_URL: "{{ .S3_PUBLIC_ENDPOINT }}/{{ .S3_BUCKET_PUBLIC }}/static"
  data:
    - secretKey: RESEND_API_KEY
      remoteRef:
        key: RESEND_API_KEY
    - secretKey: RESEND_FROM_EMAIL
      remoteRef:
        key: RESEND_FROM_EMAIL
    - secretKey: REDIS_HOST
      remoteRef:
        key: REDIS_HOST
    - secretKey: REDIS_PORT
      remoteRef:
        key: REDIS_PORT
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: REDIS_PASSWORD
    - secretKey: S3_PUBLIC_ENDPOINT
      remoteRef:
        key: S3_PUBLIC_ENDPOINT
    - secretKey: S3_BUCKET_PUBLIC
      remoteRef:
        key: S3_BUCKET_PUBLIC
