apiVersion: apps/v1
kind: Deployment
metadata:
  name: notify
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notify
  template:
    metadata:
      labels:
        app: notify
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: notify
          image: ghcr.io/paveproject/pave-notify:b25-1c3ef7c
          envFrom:
            - secretRef:
                name: notify-secrets
          # Rust, not Recomend's Node worker - much lighter baseline.
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "250m"
