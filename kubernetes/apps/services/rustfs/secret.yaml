apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rustfs-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: rustfs-secrets
    creationPolicy: Owner
  data:
    - secretKey: RUSTFS_ACCESS_KEY
      remoteRef:
        key: RUSTFS_ACCESS_KEY
    - secretKey: RUSTFS_SECRET_KEY
      remoteRef:
        key: RUSTFS_SECRET_KEY
