apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rustfs-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: rustfs-secrets
    creationPolicy: Owner
  data:
    - secretKey: RUSTFS_ACCESS_KEY
      remoteRef:
        key: RUSTFS_ACCESS_KEY
    - secretKey: RUSTFS_SECRET_KEY
      remoteRef:
        key: RUSTFS_SECRET_KEY
    # Same Infisical key api's S3_BUCKET_PUBLIC reads - one bucket name,
    # shared, not two copies.
    - secretKey: S3_BUCKET_PUBLIC
      remoteRef:
        key: S3_BUCKET_PUBLIC
    # Same reasoning, for api's S3_BUCKET_PRIVATE - this job creates both
    # buckets, see bucket-init-job.yaml.
    - secretKey: S3_BUCKET_PRIVATE
      remoteRef:
        key: S3_BUCKET_PRIVATE
