# Mirrors every bucket on this RustFS instance to the same R2 target
# postgres backs up to, under its own rustfs-data/ prefix - not just the
# one public bucket api/notify know about. "local/" with no bucket name
# is the whole alias (every bucket), so a future second bucket (private
# uploads, etc.) is covered automatically, no change needed here.
# No --remove: files deleted locally stay in the backup (safety net
# against accidental deletion, not just data loss).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rustfs-backup
spec:
  schedule: "0 4 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: rustfs-mirror
              image: rustfs/rc:latest
              env:
                - name: LOCAL_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: rustfs-secrets
                      key: RUSTFS_ACCESS_KEY
                - name: LOCAL_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: rustfs-secrets
                      key: RUSTFS_SECRET_KEY
              envFrom:
                - secretRef:
                    name: rustfs-backup-target
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  echo "Starting RustFS mirror to backup target..."

                  rc alias set local http://rustfs:9000 "${LOCAL_ACCESS_KEY}" "${LOCAL_SECRET_KEY}"
                  rc alias set backup "${BACKUP_S3_ENDPOINT}" "${BACKUP_S3_ACCESS_KEY_ID}" "${BACKUP_S3_SECRET_ACCESS_KEY}"

                  # "local/" with no bucket name isn't a valid `mirror` source
                  # (confirmed: "Invalid path: Bucket name cannot be empty") -
                  # unlike `bucket list`, which does accept a bare alias. List
                  # every bucket and mirror each one under its own name instead,
                  # so a future second bucket is still covered automatically,
                  # no change needed here.
                  for bucket in $(rc bucket list local/ --json | jq -r '.items[].key'); do
                    echo "Mirroring bucket: ${bucket}"
                    rc mirror --overwrite "local/${bucket}/" "backup/${BACKUP_S3_BUCKET}/rustfs-data/${bucket}/"
                  done

                  echo "RustFS mirror complete."
