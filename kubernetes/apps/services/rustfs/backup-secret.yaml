# Same Infisical keys as postgres/backup-secret.yaml - one backup target
# (bucket + credentials), two CronJobs writing under different prefixes.
# No reason to create a second R2 bucket/credential pair just because a
# different service is backing up to it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rustfs-backup-target
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: rustfs-backup-target
    creationPolicy: Owner
  data:
    - secretKey: BACKUP_S3_ACCESS_KEY_ID
      remoteRef:
        key: BACKUP_S3_ACCESS_KEY_ID
    - secretKey: BACKUP_S3_SECRET_ACCESS_KEY
      remoteRef:
        key: BACKUP_S3_SECRET_ACCESS_KEY
    - secretKey: BACKUP_S3_BUCKET
      remoteRef:
        key: BACKUP_S3_BUCKET
    - secretKey: BACKUP_S3_ENDPOINT
      remoteRef:
        key: BACKUP_S3_ENDPOINT
