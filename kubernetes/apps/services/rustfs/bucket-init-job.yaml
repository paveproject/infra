# One-shot: creates the public-read bucket named by S3_BUCKET_PUBLIC, and
# the private bucket named by S3_BUCKET_PRIVATE (protest-mode uploads -
# never given a public-read policy, unlike the one above).
# Mirrors docker-compose.yaml's rustfs-setup service.
#
# PostSync, not Sync: needs rustfs's own Deployment already up and
# reachable, not just scheduled - PostSync waits for the whole sync's
# normal resources to be Healthy first. BeforeHookCreation deletes the
# previous run before every new one (Job.spec.template is immutable).
# activeDeadlineSeconds: fail fast instead of retrying forever if RustFS
# never comes up.
apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-bucket-init
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: rustfs-bucket-init
          image: rustfs/rc:latest
          envFrom:
            - secretRef:
                name: rustfs-secrets
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Waiting for RustFS..."
              until rc alias set myrustfs http://rustfs:9000 "${RUSTFS_ACCESS_KEY}" "${RUSTFS_SECRET_KEY}"; do
                sleep 2
              done

              rc bucket create --ignore-existing "myrustfs/${S3_BUCKET_PUBLIC}"
              rc bucket anonymous set download "myrustfs/${S3_BUCKET_PUBLIC}"
              echo "Bucket ${S3_BUCKET_PUBLIC} ready and set to public read."

              rc bucket create --ignore-existing "myrustfs/${S3_BUCKET_PRIVATE}"
              echo "Bucket ${S3_BUCKET_PRIVATE} ready (private, no public-read policy)."
