apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rustfs
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-http01
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - medias.paveproject.org
      secretName: rustfs-tls
  rules:
    - host: medias.paveproject.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rustfs
                port:
                  number: 9000
