apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: db-migrator
  namespace: argocd
  annotations:
    # After postgres (-5) is Healthy, before api/notify (0, default -
    # both need the schema to already exist on first boot).
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  source:
    repoURL: https://github.com/paveproject/infra.git
    targetRevision: main
    path: kubernetes/apps/services/db-migrator
  destination:
    server: https://kubernetes.default.svc
    namespace: pave
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
