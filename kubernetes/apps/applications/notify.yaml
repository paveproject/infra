apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notify
  namespace: argocd
  annotations:
    # Explicit, even though 0 is the default. notify never touches
    # Postgres directly, so it doesn't strictly need db-migrator - kept
    # at the same wave as api for consistency with the rest of apps-root.
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/paveproject/infra.git
    targetRevision: main
    path: kubernetes/apps/services/notify
  destination:
    server: https://kubernetes.default.svc
    namespace: pave
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
