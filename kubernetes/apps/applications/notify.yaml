apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notify
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/paveproject/infra.git
    targetRevision: main
    path: kubernetes/apps/services/notify
  destination:
    server: https://kubernetes.default.svc
    namespace: pave
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
