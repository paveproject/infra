apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api
  namespace: argocd
  annotations:
    # Explicit, even though 0 is the default - needs the schema db-migrator
    # (-3) just created to already exist on first boot.
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/paveproject/infra.git
    targetRevision: main
    path: kubernetes/apps/services/api
  destination:
    server: https://kubernetes.default.svc
    namespace: pave
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
