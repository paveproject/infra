apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ghcr-pull-secret
  namespace: argocd
  annotations:
    # Same tier as postgres/redis/rustfs (-5) - every image-pulling
    # Deployment/Job below it needs this secret to exist first.
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: default
  source:
    repoURL: https://github.com/paveproject/infra.git
    targetRevision: main
    path: kubernetes/apps/services/ghcr-pull-secret
  destination:
    server: https://kubernetes.default.svc
    namespace: pave
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
