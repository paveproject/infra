---
config_format_version: 1
# No hetzner_token key here on purpose: hetzner-k3s (v2.6.0, confirmed from
# its own source) reads the token exclusively from the HCLOUD_TOKEN env var
# via `ENV.fetch("HCLOUD_TOKEN", "")` as this field's default - but since
# this class uses YAML::Serializable, a `hetzner_token:` key present in this
# file (even a `${HCLOUD_TOKEN}`-style placeholder, which YAML has no
# interpolation for and would be read as that literal string) OVERRIDES
# that default. Leave this key out entirely so the real env var is used.
cluster_name: paveproject
kubeconfig_path: "./kubeconfig"
k3s_version: v1.31.4+k3s1 # double check against `hetzner-k3s releases` before the first run

networking:
  ssh:
    port: 22
    use_agent: false
    public_key_path: "~/.ssh/id_ed25519.pub"
    private_key_path: "~/.ssh/id_ed25519"
  allowed_networks:
    ssh:
      - 0.0.0.0/0
    api:
      - 0.0.0.0/0
  public_network:
    ipv4: true
    ipv6: true
  private_network:
    enabled: true
    subnet: 10.0.0.0/16
    existing_network_name: ""
  cni:
    enabled: true

# Single node for v1 - it's both the control plane and the only worker.
# No Hetzner Load Balancer: Traefik (bundled in k3s) binds this node's
# public IP directly, DNS A records point straight at it. Add a
# worker_node_pools entry (and, once there's more than one node, a Hetzner
# LB) later without touching anything else in this repo.
schedule_workloads_on_masters: true

masters_pool:
  instance_type: cx23
  instance_count: 1
  locations:
    - nbg1

worker_node_pools: []

# hetzner-k3s disables every addon below by default (even the ones k3s
# itself normally bundles) unless explicitly turned on here - confirmed
# from its own source (src/configuration/models/addons.cr: Toggle.new(false)
# for traefik/metrics_server/servicelb, ClusterAutoscaler's own
# `enabled: Bool = true` default for that one instead). The comment above
# (masters_pool) already assumed Traefik would be running; this is what
# actually makes that true.
addons:
  traefik:
    enabled: true
  metrics_server:
    enabled: true
  # k3s' bundled lightweight LoadBalancer controller ("Klipper") - without
  # it, Traefik's own Service (type: LoadBalancer) never gets an external
  # IP assigned (stays <pending> forever), since there's no real Hetzner
  # Load Balancer resource here for hcloud-cloud-controller-manager to
  # bind it to instead (that's the whole "No Hetzner Load Balancer" point
  # above - this node's own public IP is what gets assigned here).
  servicelb:
    enabled: true
  # No worker_node_pools to scale (single fixed master node, see above) -
  # left enabled (its own default) it just crash-loops forever with
  # nothing to do.
  cluster_autoscaler:
    enabled: false
